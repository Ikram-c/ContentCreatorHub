services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: creator_hub_azurite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    command: >
      azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0
      --tableHost 0.0.0.0 --skipApiVersionCheck

  fake-gcs-server:
    image: fsouza/fake-gcs-server:latest
    container_name: creator_hub_gcs
    ports:
      - "4443:4443"
    command: "-scheme http -port 4443 -external-url http://127.0.0.1:4443"

  content-creator-hub:
    build:
      context: .
    container_name: content_creator_hub_app
    ports:
      - "8080:8080"
    environment:
      CONTENT_HUB_GDPR_SECRET: "sandbox-ephemeral-hkdf-master-secret"
      STORAGE_EMULATOR_HOST: "http://fake-gcs-server:4443"
    depends_on:
      - azurite
      - fake-gcs-server
    command: "python3 -m content_hub.server --config config.yaml --serve"
